<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pick a role</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap">
<style>
body{margin:0;background:#E9E6DE}
a{color:#1F6F6B}a:hover{color:#174F4C}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; padding: 12px 20px 32px; background: #F6F4EF; color: #1B1A17; font-family: 'IBM Plex Sans', system-ui, sans-serif; overflow: hidden">
<div style="display: flex; align-items: center; justify-content: space-between; min-height: 44px">
<a href="Welcome.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; color: #1B1A17"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: #5E5A52">STEP 1 OF 7</span>
<a href="Connect.dc.html" style="min-width: 44px; min-height: 44px; display: flex; align-items: center; justify-content: flex-end; font-size: 14px; font-weight: 500; text-decoration: none">Skip</a>
</div>
<div style="display: flex; gap: 4px"><span style="flex-grow: 1; height: 4px; border-radius: 2px; background: #1F6F6B"></span><span style="flex-grow: 1; height: 4px; border-radius: 2px; background: #DDD8CC"></span><span style="flex-grow: 1; height: 4px; border-radius: 2px; background: #DDD8CC"></span><span style="flex-grow: 1; height: 4px; border-radius: 2px; background: #DDD8CC"></span><span style="flex-grow: 1; height: 4px; border-radius: 2px; background: #DDD8CC"></span><span style="flex-grow: 1; height: 4px; border-radius: 2px; background: #DDD8CC"></span><span style="flex-grow: 1; height: 4px; border-radius: 2px; background: #DDD8CC"></span></div>
<div style="display: flex; flex-direction: column; gap: 8px; margin-top: 8px">
<h1 style="margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: 36px; line-height: 1.05">What do you mostly do?</h1>
<p style="margin: 0; font-size: 14px; line-height: 1.45; color: #5E5A52">We'll suggest accounts and agents to start with.</p>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{ roles }}" as="r" hint-placeholder-count="4">
<button onClick="{{ r.pick }}" aria-pressed="{{ r.pressed }}" style="{{ r.style }}"><span style="font-size: 16px; font-weight: 600">{{ r.title }}</span><span style="font-size: 12px; line-height: 1.4; color: #5E5A52">{{ r.hint }}</span></button>
</sc-for>
</div>
<div style="flex-grow: 1"></div>
<a href="Connect.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 14px; background: #1B1A17; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none">Continue</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const pick = (this.state && this.state.role) || 'build';
    const base = 'display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-end; gap: 6px; min-height: 132px; padding: 16px; border-radius: 16px; text-align: left; cursor: pointer; color: #1B1A17; ';
    const rows = [
      ['build', 'Build software', 'GitHub, Jira, Slack'],
      ['lead', 'Lead a team', 'Calendar, Slack, Jira'],
      ['run', 'Run a business', 'Email, Notion, Calendar'],
      ['student', 'Student', 'Gmail, Calendar, Notion, due dates'],
      ['mix', 'A bit of everything', 'We will suggest as we go']
    ];
    return {
      roles: rows.map((r) => ({
        title: r[1], hint: r[2],
        pressed: r[0] === pick ? 'true' : 'false',
        style: base + (r[0] === pick ? 'border: 2px solid #1F6F6B; background: #E3EFEC' : 'border: 2px solid #E4E0D6; background: #FFFFFF') + (r[0] === 'mix' ? '; grid-column: span 2; min-height: 84px' : ''),
        pick: () => this.setState({ role: r[0] })
      }))
    };
  }
}
</script>
</body>
</html>
