<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Connectors</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap">
<style>
body{margin:0;background:#E9E6DE}
a{color:#1F6F6B}a:hover{color:#174F4C}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; padding: 12px 20px 20px; background: #F6F4EF; color: #1B1A17; font-family: 'IBM Plex Sans', system-ui, sans-serif; overflow: hidden">
<a href="Control.dc.html" style="align-self: flex-start; display: flex; align-items: center; gap: 4px; min-height: 44px; font-size: 15px; font-weight: 500; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>Control</a>
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: 36px; line-height: 1">Connectors</h1>
<span style="font-size: 13px; color: #5E5A52">9 accounts across 5 services</span>
</div>
<sc-for list="{{ groups }}" as="g" hint-placeholder-count="5">
<section style="display: flex; flex-direction: column; gap: 0">
<div style="display: flex; justify-content: space-between; align-items: center">
<h2 style="margin: 0; font-size: 12px; font-weight: 600; color: #5E5A52">{{ g.name }} <span style="font-weight: 400">· {{ g.covers }}</span></h2>
<button style="min-height: 44px; padding: 0 4px; border: 0; background: transparent; color: #1F6F6B; font-size: 13px; font-weight: 600; cursor: pointer">+ Add</button>
</div>
<div style="display: flex; flex-direction: column; background: #FFFFFF; border: 1px solid #E4E0D6; border-radius: 14px">
<sc-for list="{{ g.accounts }}" as="a" hint-placeholder-count="2">
<div style="{{ a.rowStyle }}">
<span style="{{ a.dot }}"></span>
<span style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1"><span style="font-size: 15px; font-weight: 500">{{ a.nick }}</span><span style="font-size: 12px; color: #5E5A52">{{ a.id }}</span></span>
<span style="{{ a.statusStyle }}">{{ a.status }}</span>
</div>
</sc-for>
</div>
</section>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const live = 'font-size: 11px; font-weight: 600; padding: 4px 9px; border-radius: 999px; background: #E3EFEC; color: #174F4C';
    const warn = 'font-size: 11px; font-weight: 600; padding: 4px 9px; border-radius: 999px; background: #F7EBDD; color: #7A3E0B';
    const sync = 'font-size: 11px; font-weight: 600; padding: 4px 9px; border-radius: 999px; background: #ECE8DF; color: #4A463F';
    const G = [
      ['Google', 'Gmail, Calendar, Drive', [['Work', 'you@company.com', '#1F6F6B', 'Live', live], ['Personal', 'you@gmail.com', '#3B5BA9', 'Live', live], ['Side project', 'hello@[yourproject].com', '#6B4FA0', 'Importing', sync]]],
      ['Microsoft 365', 'Outlook, Teams, OneDrive', [['Client', 'you@client.com', '#8A5A2B', 'Reconnect', warn]]],
      ['Slack', 'per workspace', [['Company', 'company.slack.com', '#1F6F6B', 'Live', live], ['Community', 'devs.slack.com', '#6B4FA0', 'Live', live]]],
      ['Atlassian', 'Jira, Confluence', [['Company', 'company.atlassian.net', '#1F6F6B', 'Live', live]]],
      ['Notion', 'pages you picked', [['Personal', '12 pages shared', '#3B5BA9', 'Live', live]]]
    ];
    return {
      groups: G.map((g) => ({
        name: g[0], covers: g[1],
        accounts: g[2].map((a, i) => ({
          nick: a[0], id: a[1], status: a[3], statusStyle: a[4],
          dot: 'width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; background: ' + a[2],
          rowStyle: 'display: flex; align-items: center; gap: 12px; min-height: 46px; padding: 0 12px 0 14px' + (i ? '; border-top: 1px solid #EEEAE1' : '')
        }))
      }))
    };
  }
}
</script>
</body>
</html>
