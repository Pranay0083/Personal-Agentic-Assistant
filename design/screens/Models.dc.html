<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Models</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap">
<style>
body{margin:0;background:#E9E6DE}
a{color:#1F6F6B}a:hover{color:#174F4C}
button,input,select{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; padding: 12px 20px 16px; background: #F6F4EF; color: #1B1A17; font-family: 'IBM Plex Sans', system-ui, sans-serif; overflow: hidden">
<a href="Control.dc.html" style="align-self: flex-start; display: flex; align-items: center; gap: 4px; min-height: 44px; font-size: 15px; font-weight: 500; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>Control</a>
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: 36px; line-height: 1">Models</h1>
<span style="font-size: 13px; color: #5E5A52">Pick a model per agent. Keys stay on your server.</span>
</div>
<section style="display: flex; flex-direction: column; gap: 6px">
<h2 style="margin: 0; font-size: 12px; font-weight: 600; color: #5E5A52">Agents</h2>
<div style="display: flex; flex-direction: column; background: #FFFFFF; border: 1px solid #E4E0D6; border-radius: 14px">
<div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 14px">
<label for="m-triage" style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 15px; font-weight: 500">Triage agent</span><span style="font-size: 12px; color: #5E5A52">Runs on every event</span></label>
<select id="m-triage" style="min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #D8D3C7; background: #F6F4EF; color: #1B1A17; font-size: 14px"><option>Claude Haiku 4.5 · fast, low cost</option><option>Claude Sonnet 5</option><option>Claude Opus 5.5</option><option>OpenAI · your key</option><option>Local · Ollama</option></select>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border-top: 1px solid #EEEAE1">
<label for="m-brief" style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 15px; font-weight: 500">Brief agent</span><span style="font-size: 12px; color: #5E5A52">Daily at 7:30</span></label>
<select id="m-brief" style="min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #D8D3C7; background: #F6F4EF; color: #1B1A17; font-size: 14px"><option>Claude Sonnet 5</option><option>Claude Haiku 4.5</option><option>Claude Opus 5.5</option><option>OpenAI · your key</option><option>Local · Ollama</option></select>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border-top: 1px solid #EEEAE1">
<label for="m-reply" style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 15px; font-weight: 500">Reply agent</span><span style="font-size: 12px; color: #5E5A52">Drafts, never sends</span></label>
<select id="m-reply" style="min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #D8D3C7; background: #F6F4EF; color: #1B1A17; font-size: 14px"><option>Claude Sonnet 5</option><option>Claude Haiku 4.5</option><option>Claude Opus 5.5</option><option>OpenAI · your key</option><option>Local · Ollama</option></select>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border-top: 1px solid #EEEAE1">
<label for="m-plan" style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 15px; font-weight: 500">Planner</span><span style="font-size: 12px; color: #5E5A52">Weekly plan, big calls</span></label>
<select id="m-plan" style="min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #D8D3C7; background: #F6F4EF; color: #1B1A17; font-size: 14px"><option>Claude Opus 5.5 · deepest</option><option>Claude Sonnet 5</option><option>Claude Haiku 4.5</option><option>OpenAI · your key</option><option>Local · Ollama</option></select>
</div>
</div>
</section>
<section style="display: flex; flex-direction: column; gap: 6px">
<h2 style="margin: 0; font-size: 12px; font-weight: 600; color: #5E5A52">Providers</h2>
<div style="display: flex; flex-direction: column; background: #FFFFFF; border: 1px solid #E4E0D6; border-radius: 14px">
<div style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 2px 10px 2px 14px"><span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1"><span style="font-size: 15px; font-weight: 500">Anthropic</span><span style="font-size: 12px; color: #5E5A52">Your API key · connected</span></span><span style="width: 8px; height: 8px; border-radius: 50%; background: #2F8F5B; margin-right: 8px"></span></div>
<div style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 2px 10px 2px 14px; border-top: 1px solid #EEEAE1"><span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1"><span style="font-size: 15px; font-weight: 500">OpenAI</span><span style="font-size: 12px; color: #5E5A52">Not connected</span></span><button style="min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid #D8D3C7; background: #FFFFFF; color: #1B1A17; font-size: 13px; font-weight: 600; cursor: pointer">Add key</button></div>
<div style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 2px 10px 2px 14px; border-top: 1px solid #EEEAE1"><span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1"><span style="font-size: 15px; font-weight: 500">Local model</span><span style="font-size: 12px; color: #5E5A52">Ollama on your Mac · not set up</span></span><button style="min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid #D8D3C7; background: #FFFFFF; color: #1B1A17; font-size: 13px; font-weight: 600; cursor: pointer">Set up</button></div>
</div>
</section>
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: #FFFFFF; border: 1px solid #E4E0D6; border-radius: 14px">
<span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1"><span style="font-size: 15px; font-weight: 500">Keep email bodies local</span><span style="font-size: 12px; color: #5E5A52">Cloud models see summaries only</span></span>
<button onClick="{{ toggle }}" aria-pressed="{{ pressed }}" aria-label="Keep email bodies local" style="{{ track }}"><span style="{{ knob }}"></span></button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const on = !!(this.state && this.state.on);
    return {
      pressed: on ? 'true' : 'false',
      track: 'position: relative; width: 52px; height: 32px; flex-shrink: 0; border-radius: 16px; border: 0; padding: 0; cursor: pointer; background: ' + (on ? '#1F6F6B' : '#CFCABE'),
      knob: 'position: absolute; top: 3px; left: ' + (on ? '23px' : '3px') + '; width: 26px; height: 26px; border-radius: 50%; background: #FFFFFF',
      toggle: () => this.setState({ on: !on })
    };
  }
}
</script>
</body>
</html>
